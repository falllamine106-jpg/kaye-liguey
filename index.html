<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaye Liguey</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f4f4;
}

.page{
display:none;
padding:20px;
}

.active{
display:block;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
margin-top:20px;
}

button{
background:#0A1E3F;
color:white;
border:none;
padding:12px;
border-radius:8px;
width:100%;
margin-top:10px;
}

input,select{
width:100%;
padding:10px;
margin-top:10px;
}

.logo{
text-align:center;
font-size:32px;
font-weight:bold;
color:#0A1E3F;
}
</style>
</head>
<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
<div class="card">
<div class="logo">KAYE LIGUEY</div>
<p align="center">L'emploi à portée de main</p>

<button onclick="suivant('page2')">
Commencer
</button>
</div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
<div class="card">
<h2>Choisir votre profil</h2>

<button onclick="choisirType('Candidat')">
Je cherche un emploi
</button>

<button onclick="choisirType('Entreprise')">
Je suis une entreprise
</button>
</div>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
<div class="card">
<h2>Informations</h2>

<input type="text" id="nom" placeholder="Nom complet">

<input type="text" id="telephone" placeholder="Téléphone">

<input type="email" id="email" placeholder="Email">

<button onclick="suivant('page4')">
Continuer
</button>
</div>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
<div class="card">
<h2>Validation</h2>

<p>Vérifiez vos informations.</p>

<button onclick="validerCompte()">
Valider mon compte
</button>
</div>
</div>

<!-- PAGE 5 -->
<div id="page5" class="page">
<div class="card">
<h1>Tableau de bord</h1>

<p id="bienvenue"></p>

<hr>

<h3>Menu</h3>

<button>Voir les offres</button>

<button>Publier une offre</button>

<button>Mes candidatures</button>

<button>Messages</button>

<button>Mon profil</button>

</div>
</div>

<script>

let typeCompte="";

function suivant(page){

document.querySelectorAll('.page')
.forEach(p=>p.classList.remove('active'));

document.getElementById(page)
.classList.add('active');
}

function choisirType(type){
typeCompte=type;
suivant('page3');
}

function validerCompte(){

let nom=
document.getElementById('nom').value;

document.getElementById('bienvenue')
.innerHTML=
"Bienvenue "+nom+
" ("+typeCompte+") sur Kaye Liguey";

suivant('page5');
}

</script>

</body>
</html>
