<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kaye Liguey</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
}

.page{
display:none;
padding:30px 20px;
}

.page.active{
display:block;
}

.box{
max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 4px 20px #0002;
}

h1{
color:#0969d8;
}

button{
width:100%;
padding:17px;
margin:10px 0;
border:0;
border-radius:12px;
font-size:17px;
font-weight:bold;
color:white;
background:#0969d8;
}

.orange{
background:#f28c28;
}

.gray{
background:#555;
}

.back{
background:#eee;
color:#222;
}

input{
width:100%;
padding:14px;
margin:8px 0;
border:1px solid #ddd;
border-radius:10px;
box-sizing:border-box;
}

</style>

</head>


<body>


<!-- ACCUEIL -->

<div id="home" class="page active">

<div class="box">

<h1>🔵 Kaye Liguey</h1>

<p>
Trouvez un emploi.<br>
Trouvez des talents.
</p>


<button
onclick="go('candidate')">

🔎 Je cherche un emploi

</button>


<button
onclick="go('company')"
class="orange">

🏢 Je suis une entreprise

</button>


<button
onclick="go('login')"
class="gray">

🔐 Se connecter

</button>

</div>

</div>



<!-- CANDIDAT -->

<div id="candidate" class="page">

<div class="box">

<button
onclick="go('home')"
class="back">

← Retour

</button>

<h1>🔎 Candidat</h1>

<p>
Créer mon compte
</p>


<input
id="first"
placeholder="Prénom">


<input
id="last"
placeholder="Nom">


<input
id="phone"
placeholder="Téléphone">


<input
id="email"
placeholder="Email">


<button
onclick="createCandidate()">

Créer mon compte

</button>

</div>

</div>



<!-- ENTREPRISE -->

<div id="company" class="page">

<div class="box">

<button
onclick="go('home')"
class="back">

← Retour

</button>

<h1>🏢 Entreprise</h1>

<p>
Créer mon compte entreprise
</p>


<input
id="companyName"
placeholder="Nom de l'entreprise">


<input
id="companyPhone"
placeholder="Téléphone">


<input
id="companyEmail"
placeholder="Email">


<button
onclick="createCompany()"
class="orange">

Créer mon entreprise

</button>

</div>

</div>



<!-- CONNEXION -->

<div id="login" class="page">

<div class="box">

<button
onclick="go('home')"
class="back">

← Retour

</button>

<h1>🔐 Connexion</h1>


<input
id="loginEmail"
placeholder="Email">


<input
id="loginPassword"
type="password"
placeholder="Mot de passe">


<button
onclick="login()">

Se connecter

</button>

</div>

</div>



<!-- JAVASCRIPT -->

<script>

function go(page){

document
.querySelectorAll(".page")
.forEach(function(element){

element.classList.remove("active");

});


var destination=
document.getElementById(page);


if(destination){

destination.classList.add("active");

window.scrollTo(0,0);

}

}


function createCandidate(){

var first=
document.getElementById("first").value;

var last=
document.getElementById("last").value;

var phone=
document.getElementById("phone").value;

var email=
document.getElementById("email").value;


if(
first==="" ||
last==="" ||
phone==="" ||
email===""
){

alert("Veuillez remplir tous les champs.");

return;

}


alert(
"✅ Compte candidat créé avec succès !"
);

go("home");

}


function createCompany(){

var name=
document.getElementById("companyName").value;

var phone=
document.getElementById("companyPhone").value;

var email=
document.getElementById("companyEmail").value;


if(
name==="" ||
phone==="" ||
email===""
){

alert("Veuillez remplir tous les champs.");

return;

}


alert(
"✅ Compte entreprise créé avec succès !"
);

go("home");

}


function login(){

var email=
document.getElementById("loginEmail").value;

var password=
document.getElementById("loginPassword").value;


if(
email==="" ||
password===""
){

alert(
"Veuillez entrer votre email et votre mot de passe."
);

return;

}


alert(
"✅ JavaScript fonctionne correctement !"
);

}

</script>


</body>

</html>
