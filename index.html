<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaye Liguey</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
      padding-bottom: 75px;
    }

    /* HEADER */
    header {
      background: #087f5b;
      color: white;
      padding: 18px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    header h1 {
      font-size: 25px;
    }

    header p {
      margin-top: 5px;
      font-size: 13px;
      opacity: 0.9;
    }

    /* PAGES */
    .page {
      display: none;
      padding: 18px;
      max-width: 800px;
      margin: auto;
    }

    .page.active {
      display: block;
    }

    .title {
      font-size: 23px;
      margin-bottom: 15px;
    }

    /* SEARCH */
    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    .search:focus {
      border-color: #087f5b;
    }

    /* CARDS */
    .job-card {
      background: white;
      border-radius: 15px;
      padding: 17px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
      cursor: pointer;
      transition: 0.2s;
    }

    .job-card:active {
      transform: scale(0.98);
    }

    .job-card h3 {
      color: #087f5b;
      margin-bottom: 8px;
    }

    .job-card p {
      margin: 6px 0;
      color: #555;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      background: #e8f7f1;
      color: #087f5b;
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 7px;
    }

    /* BUTTON */
    button {
      border: none;
      cursor: pointer;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      background: #087f5b;
      color: white;
      border-radius: 11px;
      font-size: 16px;
      margin-top: 10px;
    }

    .main-btn:active {
      transform: scale(0.98);
    }

    .back-btn {
      background: #e8f7f1;
      color: #087f5b;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    /* FORM */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      background: white;
      font-size: 15px;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* DETAIL */
    .detail-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .detail-card h2 {
      color: #087f5b;
      margin-bottom: 15px;
    }

    .detail-line {
      margin: 12px 0;
      font-size: 15px;
    }

    .description {
      background: #f5f7fb;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.6;
      margin-top: 10px;
      white-space: pre-wrap;
    }

    /* PROFILE */
    .profile-box {
      text-align: center;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .profile-photo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #087f5b;
      margin-bottom: 12px;
    }

    .photo-btn {
      background: #e8f7f1;
      color: #087f5b;
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 10px;
    }

    /* MESSAGES */
    .empty {
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 15px;
      color: #777;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-btn {
      background: transparent;
      color: #777;
      font-size: 11px;
      text-align: center;
      padding: 5px;
      min-width: 60px;
    }

    .nav-btn .icon {
      display: block;
      font-size: 22px;
      margin-bottom: 2px;
    }

    .nav-btn.active {
      color: #087f5b;
      font-weight: bold;
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .error {
      background: #ffecec;
      color: #b00020;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .success {
      background: #e8f7f1;
      color: #087f5b;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>💼 Kaye Liguey</h1>
    <p>Trouvez votre prochaine opportunité</p>
  </header>


  <!-- ACCUEIL -->
  <section id="homePage" class="page active">
    <h2 class="title">🏠 Accueil</h2>

    <input
      type="text"
      id="homeSearch"
      class="search"
      placeholder="🔎 Rechercher un emploi..."
    >

    <div id="homeJobs">
      <div class="loading">Chargement des offres...</div>
    </div>
  </section>


  <!-- JOBS -->
  <section id="jobsPage" class="page">
    <h2 class="title">💼 Toutes les offres</h2>

    <input
      type="text"
      id="jobsSearch"
      class="search"
      placeholder="🔎 Rechercher une offre..."
    >

    <div id="jobsList">
      <div class="loading">Chargement des offres...</div>
    </div>
  </section>


  <!-- PUBLIER -->
  <section id="publishPage" class="page">
    <h2 class="title">➕ Publier une offre</h2>

    <div id="publishMessage"></div>

    <form id="jobForm">

      <div class="form-group">
        <label>Titre du poste</label>
        <input
          type="text"
          id="jobTitle"
          placeholder="Exemple : Développeur Web"
          required
        >
      </div>

      <div class="form-group">
        <label>Entreprise</label>
        <input
          type="text"
          id="jobCompany"
          placeholder="Nom de l'entreprise"
          required
        >
      </div>

      <div class="form-group">
        <label>Localisation</label>
        <input
          type="text"
          id="jobLocation"
          placeholder="Exemple : Dakar"
          required
        >
      </div>

      <div class="form-group">
        <label>Type de contrat</label>

        <select id="jobType">
          <option value="Stage">Stage</option>
          <option value="CDI">CDI</option>
          <option value="CDD">CDD</option>
          <option value="Temps partiel">Temps partiel</option>
          <option value="Freelance">Freelance</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div class="form-group">
        <label>Salaire</label>
        <input
          type="text"
          id="jobSalary"
          placeholder="Exemple : 100 000 FCFA"
        >
      </div>

      <div class="form-group">
        <label>Description</label>

        <textarea
          id="jobDescription"
          placeholder="Décrivez le poste, les compétences demandées..."
          required
        ></textarea>
      </div>

      <button type="submit" class="main-btn">
        📢 Publier l'offre
      </button>

    </form>
  </section>


  <!-- MESSAGES -->
  <section id="messagesPage" class="page">
    <h2 class="title">💬 Messages</h2>

    <div class="empty">
      <div style="font-size:40px;">💬</div>
      <br>
      <strong>Aucun message</strong>
      <p style="margin-top:8px;">
        Vos conversations apparaîtront ici.
      </p>
    </div>
  </section>


  <!-- PROFIL -->
  <section id="profilePage" class="page">
    <h2 class="title">👤 Mon profil</h2>

    <div class="profile-box">

      <img
        id="profilePhoto"
        class="profile-photo"
        src="https://via.placeholder.com/110"
        alt="Photo de profil"
      >

      <h3 id="profileName">Utilisateur Kaye Liguey</h3>

      <p style="margin-top:8px;color:#777;">
        Votre profil
      </p>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
        style="display:none;"
      >

      <button
        class="photo-btn"
        id="changePhotoBtn"
      >
        📷 Changer la photo
      </button>

    </div>
  </section>


  <!-- DETAIL D'UNE OFFRE -->
  <section id="detailPage" class="page">

    <button class="back-btn" id="backBtn">
      ← Retour
    </button>

    <div id="jobDetail"></div>

  </section>


  <!-- NAVIGATION -->
  <nav class="bottom-nav">

    <button class="nav-btn active" data-page="homePage">
      <span class="icon">🏠</span>
      Accueil
    </button>

    <button class="nav-btn" data-page="jobsPage">
      <span class="icon">💼</span>
      Jobs
    </button>

    <button class="nav-btn" data-page="publishPage">
      <span class="icon">➕</span>
      Publier
    </button>

    <button class="nav-btn" data-page="messagesPage">
      <span class="icon">💬</span>
      Messages
    </button>

    <button class="nav-btn" data-page="profilePage">
      <span class="icon">👤</span>
      Profil
    </button>

  </nav>


  <!-- JAVASCRIPT -->
  <script type="module">

    /* =========================
       FIREBASE
    ========================= */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyDEXy-VTC7nQ5KCe9x4s70j1tWtLrBvtl0",
      authDomain: "kaye-liguey.firebaseapp.com",
      projectId: "kaye-liguey",
      storageBucket: "kaye-liguey.firebasestorage.app",
      messagingSenderId: "6308207019",
      appId: "1:6308207019:web:6dca2b99992ef11dcb1aee",
      measurementId: "G-C7244S0ZLM"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    /* =========================
       VARIABLES
    ========================= */

    let jobs = [];


    /* =========================
       NAVIGATION
    ========================= */

    function showPage(pageId) {

      document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
      });

      const page = document.getElementById(pageId);

      if (page) {
        page.classList.add("active");
      }

      document.querySelectorAll(".nav-btn").forEach(button => {
        button.classList.remove("active");
      });

      const activeButton = document.querySelector(
        `.nav-btn[data-page="${pageId}"]`
      );

      if (activeButton) {
        activeButton.classList.add("active");
      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    /* =========================
       NAV BUTTONS
    ========================= */

    document.querySelectorAll(".nav-btn").forEach(button => {

      button.addEventListener("click", () => {

        const pageId = button.dataset.page;

        showPage(pageId);

      });

    });


    /* =========================
       AFFICHAGE DES OFFRES
    ========================= */

    function displayJobs(list, containerId) {

      const container = document.getElementById(containerId);

      if (!container) return;

      if (!list || list.length === 0) {

        container.innerHTML = `
          <div class="empty">
            <div style="font-size:40px;">💼</div>
            <br>
            <strong>Aucune offre trouvée</strong>
            <p style="margin-top:8px;">
              Les nouvelles offres apparaîtront ici.
            </p>
          </div>
        `;

        return;
      }


      container.innerHTML = "";


      list.forEach(job => {

        const card = document.createElement("div");

        card.className = "job-card";

        card.innerHTML = `

          <h3>${escapeHTML(job.title)}</h3>

          <p>🏢 ${escapeHTML(job.company)}</p>

          <p>📍 ${escapeHTML(job.location)}</p>

          <p>💰 ${escapeHTML(job.salary || "Non précisé")}</p>

          <span class="badge">
            ${escapeHTML(job.type || "Non précisé")}
          </span>

        `;


        card.addEventListener("click", () => {

          showJobDetail(job);

        });


        container.appendChild(card);

      });

    }


    /* =========================
       DETAIL OFFRE
    ========================= */

    function showJobDetail(job) {

      const detail = document.getElementById("jobDetail");

      detail.innerHTML = `

        <div class="detail-card">

          <h2>${escapeHTML(job.title)}</h2>

          <div class="detail-line">
            🏢 <strong>Entreprise :</strong>
            ${escapeHTML(job.company)}
          </div>

          <div class="detail-line">
            📍 <strong>Lieu :</strong>
            ${escapeHTML(job.location)}
          </div>

          <div class="detail-line">
            💼 <strong>Type :</strong>
            ${escapeHTML(job.type || "Non précisé")}
          </div>

          <div class="detail-line">
            💰 <strong>Salaire :</strong>
            ${escapeHTML(job.salary || "Non précisé")}
          </div>

          <hr style="margin:18px 0;border:none;border-top:1px solid #eee;">

          <strong>Description :</strong>

          <div class="description">
            ${escapeHTML(job.description || "Aucune description.")}
          </div>

          <button
            class="main-btn"
            id="applyButton"
          >
            📩 Postuler
          </button>

        </div>

      `;


      showPage("detailPage");


      document
        .getElementById("applyButton")
        .addEventListener("click", () => {

          alert(
            "Votre demande de candidature a été enregistrée. La fonction de candidature avec compte utilisateur sera ajoutée dans la prochaine version."
          );

        });

    }


    /* =========================
       RETOUR
    ========================= */

    document
      .getElementById("backBtn")
      .addEventListener("click", () => {

        showPage("jobsPage");

      });


    /* =========================
       CHARGER FIRESTORE
    ========================= */

    async function loadJobs() {

      const homeContainer = document.getElementById("homeJobs");
      const jobsContainer = document.getElementById("jobsList");

      try {

        const snapshot = await getDocs(
          collection(db, "Jobs")
        );


        jobs = [];


        snapshot.forEach(doc => {

          jobs.push({
            id: doc.id,
            ...doc.data()
          });

        });


        // Les plus récentes en premier
        jobs.reverse();


        displayJobs(
          jobs.slice(0, 5),
          "homeJobs"
        );


        displayJobs(
          jobs,
          "jobsList"
        );


      } catch (error) {

        console.error("Erreur Firebase :", error);


        homeContainer.innerHTML = `
          <div class="error">
            ❌ Impossible de charger les offres.
            <br><br>
            Vérifiez votre connexion et les règles Firestore.
          </div>
        `;


        jobsContainer.innerHTML = `
          <div class="error">
            ❌ Impossible de charger les offres.
          </div>
        `;

      }

    }


    /* =========================
       RECHERCHE ACCUEIL
    ========================= */

    document
      .getElementById("homeSearch")
      .addEventListener("input", event => {

        const search = event.target.value
          .toLowerCase()
          .trim();


        if (!search) {

          displayJobs(
            jobs.slice(0, 5),
            "homeJobs"
          );

          return;

        }


        const results = jobs.filter(job => {

          return (

            String(job.title || "")
              .toLowerCase()
              .includes(search)

            ||

            String(job.company || "")
              .toLowerCase()
              .includes(search)

            ||

            String(job.location || "")
              .toLowerCase()
              .includes(search)

            ||

            String(job.type || "")
              .toLowerCase()
              .includes(search)

          );

        });


        displayJobs(
          results,
          "homeJobs"
        );

      });


    /* =========================
       RECHERCHE JOBS
    ========================= */

    document
      .getElementById("jobsSearch")
      .addEventListener("input", event => {

        const search = event.target.value
          .toLowerCase()
          .trim();


        if (!search) {

          displayJobs(
            jobs,
            "jobsList"
          );

          return;

        }


        const results = jobs.filter(job => {

          return (

            String(job.title || "")
              .toLowerCase()
              .includes(search)

            ||

            String(job.company || "")
              .toLowerCase()
              .includes(search)

            ||

            String(job.location || "")
              .toLowerCase()
              .includes(search)

            ||

            String(job.type || "")
              .toLowerCase()
              .includes(search)

            ||

            String(job.description || "")
              .toLowerCase()
              .includes(search)

          );

        });


        displayJobs(
          results,
          "jobsList"
        );

      });


    /* =========================
       PUBLIER UNE OFFRE
    ========================= */

    document
      .getElementById("jobForm")
      .addEventListener("submit", async event => {

        event.preventDefault();


        const message =
          document.getElementById("publishMessage");


        const title =
          document.getElementById("jobTitle").value.trim();

        const company =
          document.getElementById("jobCompany").value.trim();

        const location =
          document.getElementById("jobLocation").value.trim();

        const type =
          document.getElementById("jobType").value;

        const salary =
          document.getElementById("jobSalary").value.trim();

        const description =
          document.getElementById("jobDescription").value.trim();


        if (!title ||
            !company ||
            !location ||
            !description) {

          message.innerHTML = `
            <div class="error">
              ❌ Veuillez remplir tous les champs obligatoires.
            </div>
          `;

          return;

        }


        const submitButton =
          document.querySelector(
            "#jobForm .main-btn"
          );


        submitButton.disabled = true;

        submitButton.textContent =
          "⏳ Publication...";


        try {

          const docRef = await addDoc(
            collection(db, "Jobs"),
            {
              title: title,
              company: company,
              location: location,
              type: type,
              salary: salary || "Non précisé",
              description: description,
              createdAt: serverTimestamp()
            }
          );


          const newJob = {

            id: docRef.id,
            title: title,
            company: company,
            location: location,
            type: type,
            salary: salary || "Non précisé",
            descrip
