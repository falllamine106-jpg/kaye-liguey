<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaye Liguey</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
header{background:#0A1E3F;color:white;text-align:center;padding:20px}
nav{display:flex;justify-content:space-around;background:white;padding:10px}
nav button{padding:10px;border:none;background:#00C853;color:white;border-radius:8px}
.page{display:none;padding:20px}
.active{display:block}
</style>
</head>
<body>

<header>
<h1>KAYE LIGUEY</h1>
<p>L'emploi à portée de main</p>
</header>

<nav>
<button onclick="showPage('home')">🏠 Accueil</button>
<button onclick="showPage('jobs')">💼 Jobs</button>
<button onclick="showPage('publish')">➕ Publier</button>
<button onclick="showPage('messages')">💬 Messages</button>
<button onclick="showPage('profile')">👤 Profil</button>
</nav>

<div id="home" class="page active">
<h2>Accueil</h2>
<p>Bienvenue sur Kaye Liguey.</p>
</div>

<div id="jobs" class="page">
<h2>Jobs</h2>
<p>Développeur Web - Dakar</p>
</div>

<div id="publish" class="page">
<h2>Publier une offre</h2>
<input placeholder="Nom entreprise"><br><br>
<button>Publier</button>
</div>

<div id="messages" class="page">
<h2>Messages</h2>
<p>Aucun message.</p>
</div>

<div id="profile" class="page">
<h2>Profil</h2>
<input type="file" accept="image/*">
</div>

<script>
function showPage(page){
document.querySelectorAll('.page').forEach(function(p){
p.classList.remove('active');
});
document.getElementById(page).classList.add('active');
}
</script>

</body>
</html>
