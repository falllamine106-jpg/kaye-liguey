<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaye Liguey</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f6;
  color:#17202a;
  padding-bottom:75px
}
header{
  background:#087f5b;
  color:white;
  padding:20px;
}
header h1{margin:0;font-size:26px}
header p{margin:6px 0 0}

.page{
  display:none;
  max-width:800px;
  margin:auto;
  padding:20px
}
.page.active{display:block}

h2{margin-top:0}

.search,input,textarea,select{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  background:white;
}

.search{margin-bottom:15px}

.form-group{margin-bottom:15px}
.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold
}

textarea{min-height:130px}

button{
  border:0;
  cursor:pointer
}

.main-btn{
  width:100%;
  padding:14px;
  border-radius:10px;
  background:#087f5b;
  color:white;
  font-size:16px;
}

.job-card{
  background:white;
  padding:17px;
  margin-bottom:13px;
  border-radius:14px;
  box-shadow:0 3px 12px #00000012;
  cursor:pointer;
}

.job-card h3{
  margin:0 0 10px;
  color:#087f5b
}

.job-card p{
  margin:7px 0;
  color:#555
}

.badge{
  display:inline-block;
  padding:6px 10px;
  background:#e7f6f0;
  color:#087f5b;
  border-radius:20px;
  font-size:12px;
}

.detail{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px #00000012;
}

.back{
  padding:10px 14px;
  border-radius:9px;
  background:#e7f6f0;
  color:#087f5b;
  margin-bottom:15px
}

.message{
  padding:14px;
  border-radius:10px;
  margin-bottom:15px;
}

.success{
  background:#e7f6f0;
  color:#087f5b
}

.error{
  background:#ffe8e8;
  color:#b00020
}

.empty{
  text-align:center;
  padding:30px;
  background:white;
  border-radius:14px;
  color:#777
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  z-index:1000;
}

.nav{
  background:white;
  color:#777;
  font-size:11px;
  min-width:60px
}

.nav span{
  display:block;
  font-size:22px
}

.nav.active{
  color:#087f5b;
  font-weight:bold
}

.profile{
  background:white;
  padding:25px;
  border-radius:14px;
  text-align:center
}

.profile img{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #087f5b
}

.photo-btn{
  margin-top:15px;
  padding:10px 15px;
  background:#e7f6f0;
  color:#087f5b;
  border-radius:9px
}

.loading{
  text-align:center;
  padding:25px;
  color:#777
}
</style>
</head>

<body>

<header>
  <h1>💼 Kaye Liguey</h1>
  <p>Trouvez votre prochaine opportunité</p>
</header>

<!-- ACCUEIL -->
<section id="home" class="page active">
  <h2>🏠 Accueil</h2>

  <input
    id="searchHome"
    class="search"
    placeholder="🔎 Rechercher un emploi"
  >

  <div id="homeJobs">
    <div class="loading">Chargement...</div>
  </div>
</section>

<!-- JOBS -->
<section id="jobs" class="page">
  <h2>💼 Jobs</h2>

  <input
    id="searchJobs"
    class="search"
    placeholder="🔎 Rechercher une offre"
  >

  <div id="jobsList">
    <div class="loading">Chargement...</div>
  </div>
</section>

<!-- PUBLICATION -->
<section id="publish" class="page">
  <h2>➕ Publier une offre</h2>

  <div id="publishMessage"></div>

  <form id="jobForm">

    <div class="form-group">
      <label>Titre du poste</label>
      <input id="title" required placeholder="Ex : Développeur Web">
    </div>

    <div class="form-group">
      <label>Entreprise</label>
      <input id="company" required placeholder="Nom de l'entreprise">
    </div>

    <div class="form-group">
      <label>Localisation</label>
      <input id="location" required placeholder="Ex : Dakar">
    </div>

    <div class="form-group">
      <label>Type</label>
      <select id="type">
        <option>Stage</option>
        <option>CDI</option>
        <option>CDD</option>
        <option>Freelance</option>
        <option>Temps partiel</option>
      </select>
    </div>

    <div class="form-group">
      <label>Salaire</label>
      <input id="salary" placeholder="Ex : 100000 FCFA">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea
        id="description"
        required
        placeholder="Décrivez le poste..."
      ></textarea>
    </div>

    <button class="main-btn" id="publishButton">
      📢 Publier l'offre
    </button>

  </form>
</section>

<!-- MESSAGES -->
<section id="messages" class="page">
  <h2>💬 Messages</h2>

  <div class="empty">
    💬<br><br>
    <strong>Aucun message</strong>
    <p>Vos conversations apparaîtront ici.</p>
  </div>
</section>

<!-- PROFIL -->
<section id="profile" class="page">
  <h2>👤 Profil</h2>

  <div class="profile">

    <img
      id="profileImage"
      src="https://via.placeholder.com/110"
      alt="Profil"
    >

    <h3>Utilisateur Kaye Liguey</h3>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
      hidden
    >

    <button class="photo-btn" id="photoButton">
      📷 Changer la photo
    </button>

  </div>
</section>

<!-- DÉTAIL -->
<section id="detail" class="page">

  <button class="back" id="backButton">
    ← Retour
  </button>

  <div id="detailContent"></div>

</section>

<!-- NAVIGATION -->
<nav class="bottom">

  <button class="nav active" data-page="home">
    <span>🏠</span>
    Accueil
  </button>

  <button class="nav" data-page="jobs">
    <span>💼</span>
    Jobs
  </button>

  <button class="nav" data-page="publish">
    <span>➕</span>
    Publier
  </button>

  <button class="nav" data-page="messages">
    <span>💬</span>
    Messages
  </button>

  <button class="nav" data-page="profile">
    <span>👤</span>
    Profil
  </button>

</nav>

<script type="module">

/* FIREBASE */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDEXy-VTC7nQ5KCe9x4s70j1tWtLrBvtl0",
  authDomain: "kaye-liguey.firebaseapp.com",
  projectId: "kaye-liguey",
  storageBucket: "kaye-liguey.firebasestorage.app",
  messagingSenderId: "6308207019",
  appId: "1:6308207019:web:6dca2b99992ef11dcb1aee",
  measurementId: "G-C7244S0ZLM"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* VARIABLES */

let jobs = [];


/* NAVIGATION */

function showPage(id){

  document.querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

  const page = document.getElementById(id);

  if(page){
    page.classList.add("active");
  }

  document.querySelectorAll(".nav")
    .forEach(n => n.classList.remove("active"));

  const nav = document.querySelector(
    `.nav[data-page="${id}"]`
  );

  if(nav){
    nav.classList.add("active");
  }

  window.scrollTo(0,0);
}


document.querySelectorAll(".nav")
.forEach(button => {

  button.addEventListener("click",function(){

    showPage(this.dataset.page);

  });

});


/* ÉCHAPPEMENT HTML */

function safe(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* AFFICHER LES JOBS */

function renderJobs(list,containerId){

  const container =
    document.getElementById(containerId);

  if(!container) return;

  if(list.length === 0){

    container.innerHTML = `
      <div class="empty">
        💼<br><br>
        <strong>Aucune offre trouvée</strong>
      </div>
    `;

    return;
  }

  container.innerHTML = "";

  list.forEach(job => {

    const card =
      document.createElement("div");

    card.className = "job-card";

    card.innerHTML = `
      <h3>${safe(job.title)}</h3>

      <p>🏢 ${safe(job.company)}</p>

      <p>📍 ${safe(job.location)}</p>

      <p>💰 ${safe(job.salary || "Non précisé")}</p>

      <span class="badge">
        ${safe(job.type || "Non précisé")}
      </span>
    `;

    card.addEventListener("click",() => {

      showDetail(job);

    });

    container.appendChild(card);

  });

}


/* DÉTAIL */

function showDetail(job){

  document.getElementById("detailContent").innerHTML = `

    <div class="detail">

      <h2>${safe(job.title)}</h2>

      <p>🏢 <strong>Entreprise :</strong>
      ${safe(job.company)}</p>

      <p>📍 <strong>Lieu :</strong>
      ${safe(job.location)}</p>

      <p>💼 <strong>Type :</strong>
      ${safe(job.type || "Non précisé")}</p>

      <p>💰 <strong>Salaire :</strong>
      ${safe(job.salary || "Non précisé")}</p>

      <hr>

      <h3>Description</h3>

      <p style="line-height:1.6">
        ${safe(job.description)}
      </p>

      <button
        id="applyButton"
        class="main-btn"
        style="margin-top:20px"
      >
        📩 Postuler
      </button>

    </div>
  `;

  showPage("detail");

  document
    .getElementById("applyButton")
    .addEventListener("click",() => {

      alert(
        "La candidature sera disponible avec le système de comptes utilisateurs."
      );

    });

}


/* RETOUR */

document
.getElementById("backButton")
.addEventListener("click",() => {

  showPage("jobs");

});


/* CHARGER FIREBASE */

async function loadJobs(){

  try{

    const snapshot =
      await getDocs(
        collection(db,"Jobs")
      );

    jobs = [];

    snapshot.forEach(doc => {

      jobs.push({
        id:doc.id,
        ...doc.data()
      });

    });

    jobs.reverse();

    renderJobs(
      jobs.slice(0,5),
      "homeJobs"
    );

    renderJobs(
      jobs,
      "jobsList"
    );

  }catch(error){

    console.error(error);

    document.getElementById("homeJobs").innerHTML = `
      <div class="message error">
        ❌ Erreur Firebase :<br>
        ${safe(error.message)}
      </div>
    `;

    document.getElementById("jobsList").innerHTML = `
      <div class="message error">
        ❌ Impossible de charger les offres.
      </div>
    `;

  }

}


/* RECHERCHE ACCUEIL */

document
.getElementById("searchHome")
.addEventListener("input",function(){

  const q =
    this.value.toLowerCase().trim();

  const results =
    jobs.filter(job =>

      `${job.title} ${job.company} ${job.location} ${job.type}`
      .toLowerCase()
      .includes(q)

    );

  renderJobs(
    q ? results : jobs.slice(0,5),
    "homeJobs"
  );

});


/* RECHERCHE JOBS */

document
.getElementById("searchJobs")
.addEventListener("input",function(){

  const q =
    this.value.toLowerCase().trim();

  const results =
    jobs.filter(job =>

      `${job.title} ${job.company} ${job.location} ${job.type} ${job.description}`
      .toLowerCase()
      .includes(q)

    );

  renderJobs(
    results,
    "jobsList"
  );

});


/* PUBLICATION */

document
.getElementById("jobForm")
.addEventListener("submit",async function(e){

  e.preventDefault();

  const button =
    document.getElementById("publishButton");

  const message =
    document.getElementById("publishMessage");

  button.disabled = true;
  button.textContent = "⏳ Publication...";

  try{

    const data = {

      title:
        document.getElementById("title").value.trim(),

      company:
        document.getElementById("company").value.trim(),

      location:
        document.getElementById("location").value.trim(),

      type:
        document.getElementById("type").value,

      salary:
        document.getElementById("salary").value.trim()
        || "Non précisé",

      description:
        document.getElementById("description").value.trim(),

      createdAt:
        serverTimestamp()

    };


    const ref =
      await addDoc(
        collection(db,"Jobs"),
        data
      );


    jobs.unshift({
      id:ref.id,
      ...data
    });


    renderJobs(
      jobs.slice(0,5),
      "homeJobs"
    );

    renderJobs(
      jobs,
      "jobsList"
    );


    message.innerHTML = `
      <div class="message success">
        ✅ Offre publiée avec succès !
      </div>
    `;


    this.reset();


    setTimeout(() => {

      message.innerHTML = "";

      showPage("jobs");

    },1000);


  }catch(error){

    console.error(error);

    message.innerHTML = `
      <div class="message error">
        ❌ Erreur :<br>
        ${safe(error.message)}
      </div>
    `;

  }


  button.disabled = false;
  button.textContent = "📢 Publier l'offre";

});


/* PHOTO */

const photoInput =
  document.getElementById("photoInput");

const photoButton =
  document.getElementById("photoButton");

const profileImage =
  document.getElementById("profileImage");


const savedPhoto =
  localStorage.getItem(
    "kayeLigueyPhoto"
  );


if(savedPhoto){

  profileImage.src = savedPhoto;

}


photoButton.addEventListener("click",() => {

  photoInput.click();

});


photoInput.addEventListener("change",function(){

  const file = this.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = function(){

    profileImage.src =
      reader.result;

    localStorage.setItem(
      "kayeLigueyPhoto",
      reader.result
    );

  };

  reader.readAsDataURL(file);

});


/* DÉMARRAGE */

loadJobs();

</script>

</body>
</html>
