<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaye Liguey</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
}

#splash{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#0d6efd;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

#home{
    display:none;
    padding:20px;
    text-align:center;
}

.btn{
    display:block;
    width:90%;
    max-width:300px;
    margin:15px auto;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
    background:#0d6efd;
    color:white;
}
</style>
</head>

<body>

<div id="splash">
    <h1>Kaye Liguey</h1>
    <p>Trouvez un emploi. Trouvez des talents.</p>
</div>

<div id="home">
    <h1>Kaye Liguey</h1>

    <button class="btn">
        🔎 Je cherche un emploi
    </button>

    <button class="btn">
        🏢 Je suis une entreprise
    </button>
</div>

<script>
setTimeout(function(){

    document.getElementById("splash").style.display="none";

    document.getElementById("home").style.display="block";

},2000);
</script>

</body>
</html>
