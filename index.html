<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Kaye Liguey</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#222;
}

.screen{
 display:none;
 min-height:100vh;
 padding:25px;
}

.screen.active{
 display:block;
}

.header{
 text-align:center;
 background:white;
 padding:20px;
 border-radius:0 0 20px 20px;
 box-shadow:0 2px 10px #0002;
}

.logo{
 width:80px;
 height:80px;
 object-fit:contain;
}

.brand{
 color:#0969d8;
 font-size:30px;
 font-weight:bold;
}

.container{
 max-width:600px;
 margin:auto;
}

.card{
 background:white;
 padding:20px;
 margin-top:20px;
 border-radius:16px;
 box-shadow:0 3px 15px #0001;
}

h2{
 color:#0969d8;
}

input{
 width:100%;
 padding:14px;
 margin:7px 0 15px;
 border:1px solid #ddd;
 border-radius:10px;
}

.btn{
 width:100%;
 padding:16px;
 margin:8px 0;
 border:0;
 border-radius:12px;
 color:white;
 background:#0969d8;
 font-size:17px;
 font-weight:bold;
}

.orange{
 background:#f28c28;
}

.gray{
 background:#777;
}

.back{
 background:none;
 border:0;
 color:#0969d8;
 font-size:16px;
 font-weight:bold;
 margin-bottom:10px;
}
</style>
</head>

<body>


<!-- ======================
     ACCUEIL
====================== -->

<section id="home" class="screen active">

 <div class="header">

  <img
   src="assets/images/logo.png"
   class="logo"
   alt="Kaye Liguey"
   onerror="this.style.display='none'"
  >

  <div class="brand">
   Kaye Liguey
  </div>

 </div>


 <div class="container">

  <div class="card" style="text-align:center">

   <h2>
    Bienvenue 👋
   </h2>

   <p>
    Trouvez un emploi.<br>
    Trouvez des talents.
   </p>


   <button
    class="btn"
    id="candidateButton">

    🔎 Je cherche un emploi

   </button>


   <button
    class="btn orange"
    id="companyButton">

    🏢 Je suis une entreprise

   </button>


   <button
    class="btn gray"
    id="loginButton">

    🔐 Se connecter

   </button>

  </div>

 </div>

</section>



<!-- ======================
     CANDIDAT
====================== -->

<section id="candidate" class="screen">

 <div class="container">

  <button
   class="back"
   id="candidateBack">

   ← Retour

  </button>


  <div class="card">

   <h2>
    🔎 Créer mon compte
   </h2>

   <p>
    Créez votre compte pour rechercher
    un emploi.
   </p>


   <label>Prénom</label>

   <input
    id="candidateFirst"
    placeholder="Votre prénom"
   >


   <label>Nom</label>

   <input
    id="candidateLast"
    placeholder="Votre nom"
   >


   <label>Téléphone</label>

   <input
    id="candidatePhone"
    type="tel"
    placeholder="+221..."
   >


   <label>Email</label>

   <input
    id="candidateEmail"
    type="email"
    placeholder="votre@email.com"
   >


   <label>Adresse</label>

   <input
    id="candidateAddress"
    placeholder="Votre adresse"
   >


   <button
    class="btn"
    id="createCandidate">

    Créer mon compte

   </button>

  </div>

 </div>

</section>



<!-- ======================
     ENTREPRISE
====================== -->

<section id="company" class="screen">

 <div class="container">

  <button
   class="back"
   id="companyBack">

   ← Retour

  </button>


  <div class="card">

   <h2>
    🏢 Créer un compte entreprise
   </h2>

   <p>
    Créez votre compte pour publier
    des offres d'emploi.
   </p>


   <label>Nom de l'entreprise</label>

   <input
    id="companyName"
    placeholder="Nom de votre entreprise"
   >


   <label>Secteur d'activité</label>

   <input
    id="companySector"
    placeholder="Ex : Informatique"
   >


   <label>Téléphone</label>

   <input
    id="companyPhone"
    type="tel"
    placeholder="+221..."
   >


   <label>Email professionnel</label>

   <input
    id="companyEmail"
    type="email"
    placeholder="entreprise@email.com"
   >


   <label>Ville</label>

   <input
    id="companyCity"
    placeholder="Dakar, Thiès..."
   >


   <button
    class="btn orange"
    id="createCompany">

    Créer mon entreprise

   </button>

  </div>

 </div>

</section>



<!-- ======================
     CONNEXION
====================== -->

<section id="login" class="screen">

 <div class="container">

  <button
   class="back"
   id="loginBack">

   ← Retour

  </button>


  <div class="card">

   <h2>
    🔐 Connexion
   </h2>


   <label>Email</label>

   <input
    id="loginEmail"
    type="email"
   >


   <label>Mot de passe</label>

   <input
    id="loginPassword"
    type="password"
   >


   <button
    class="btn"
    id="connectButton">

    Se connecter

   </button>

  </div>

 </div>

</section>



<script>

/*
================================
FONCTION POUR CHANGER D'ÉCRAN
================================
*/

function openScreen(screenId){

 document
 .querySelectorAll(".screen")
 .forEach(function(screen){

  screen.classList.remove("active");

 });


 var screen =
 document.getElementById(screenId);


 if(screen){

  screen.classList.add("active");

  window.scrollTo(0,0);

 }

}


/*
================================
BOUTON CHERCHEUR D'EMPLOI
================================
*/

document
.getElementById("candidateButton")
.addEventListener("click",function(){

 openScreen("candidate");

});


/*
================================
BOUTON ENTREPRISE
================================
*/

document
.getElementById("companyButton")
.addEventListener("click",function(){

 openScreen("company");

});


/*
================================
BOUTON CONNEXION
================================
*/

document
.getElementById("loginButton")
.addEventListener("click",function(){

 openScreen("login");

});


/*
================================
RETOURS
================================
*/

document
.getElementById("candidateBack")
.addEventListener("click",function(){

 openScreen("home");

});


document
.getElementById("companyBack")
.addEventListener("click",function(){

 openScreen("home");

});


document
.getElementById("loginBack")
.addEventListener("click",function(){

 openScreen("home");

});


/*
================================
CRÉATION CANDIDAT
================================
*/

document
.getElementById("createCandidate")
.addEventListener("click",function(){

 var first =
 document.getElementById("candidateFirst").value;

 var last =
 document.getElementById("candidateLast").value;

 var phone =
 document.getElementById("candidatePhone").value;

 var email =
 document.getElementById("candidateEmail").value;


 if(!first || !last || !phone || !email){

  alert("Veuillez remplir les champs obligatoires.");

  return;

 }


 alert(
  "Compte candidat créé avec succès !"
 );

});


/*
================================
CRÉATION ENTREPRISE
================================
*/

document
.getElementById("createCompany")
.addEventListener("click",function(){

 var name =
 document.getElementById("companyName").value;

 var phone =
 document.getElementById("companyPhone").value;

 var email =
 document.getElementById("companyEmail").value;


 if(!name || !phone || !email){

  alert("Veuillez remplir les champs obligatoires.");

  return;

 }


 alert(
  "Compte entreprise créé avec succès !"
 );

});


/*
================================
CONNEXION
================================
*/

document
.getElementById("connectButton")
.addEventListener("click",function(){

 alert(
  "La connexion sera activée avec Firebase."
 );

});

</script>

</body>
</html>
